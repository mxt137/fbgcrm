<div class="page-header d-print-none mt-4">
  <div class="container-xl">
    <div class="row g-2 align-items-center">
      <div class="col">
        <h2 class="page-title" style="color: var(--tblr-primary); font-weight: 700;">
          <i class="ti ti-users me-2"></i> Quản lý nhân sự
        </h2>
        <div class="text-muted mt-1" style="font-size: 13px;">Phân quyền Admin, Leader, và Sales</div>
      </div>
      <div class="col-auto ms-auto d-print-none" id="adminActionsPanel">
        <button class="btn btn-brand d-flex align-items-center gap-2" data-bs-toggle="modal" data-bs-target="#modal-member" onclick="openMemberModal()">
          <i class="ti ti-plus"></i> Thêm nhân sự
        </button>
      </div>
    </div>
  </div>
</div>

<div class="page-body">
  <div class="container-xl">
    <div class="card shadow-sm" style="border-radius: 12px; overflow: hidden;">
      <div class="table-responsive">
        <table class="table table-vcenter card-table table-hover text-nowrap">
          <thead>
            <tr>
              <th class="w-1 text-center">STT</th>
              <th>HỌ VÀ TÊN</th>
              <th>EMAIL (TÀI KHOẢN)</th>
              <th>QUYỀN HẠN</th>
              <th>ĐĂNG NHẬP CUỐI</th>
              <th>TRẠNG THÁI</th>
              <th class="text-center admin-only-col">THAO TÁC</th>
            </tr>
          </thead>
          <tbody id="memberTableBody">
            <tr><td colspan="7" class="text-center py-4">Đang kết nối cơ sở dữ liệu...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Modal Thêm/Sửa Nhân Viên -->
<div class="modal modal-blur fade" id="modal-member" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content shadow-lg" style="border-radius: 12px; overflow: hidden; border: none;">
      <div class="modal-header" style="background: linear-gradient(135deg, #146654 0%, #0d4639 100%); color: white; border-bottom: none; padding: 20px;">
        <h5 class="modal-title fs-3 fw-bold" id="modalTitleMember"><i class="ti ti-user-scan me-2"></i> Hồ Sơ Nhân Sự</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" id="btnCloseMemberModal"></button>
      </div>
      <form id="memberForm" onsubmit="event.preventDefault(); saveMember();">
        <div class="modal-body p-4">
          <input type="hidden" id="memberId">
          
          <div class="mb-3">
            <label class="form-label fw-bold">Họ và tên</label>
            <div class="input-icon">
              <span class="input-icon-addon"><i class="ti ti-user"></i></span>
              <input type="text" id="memFullName" class="form-control" required>
            </div>
          </div>
          
          <div class="mb-3">
            <label class="form-label fw-bold">Email truy cập</label>
            <div class="input-icon">
              <span class="input-icon-addon"><i class="ti ti-mail"></i></span>
              <input type="email" id="memEmail" class="form-control" required>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">Mật khẩu</label>
            <div class="input-icon">
              <span class="input-icon-addon"><i class="ti ti-key"></i></span>
              <input type="text" id="memPass" class="form-control">
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">Vai trò</label>
            <div class="input-icon">
              <span class="input-icon-addon"><i class="ti ti-shield"></i></span>
              <select id="memRole" class="form-select fw-bold">
                <option value="sales">Thành viên (Sales)</option>
                <option value="manager">Trưởng nhóm (Leader)</option>
                <option value="admin">Quản trị viên (Admin)</option>
              </select>
            </div>
          </div>
        </div>
        <div class="modal-footer bg-light p-3">
          <button type="button" class="btn btn-link text-muted" data-bs-dismiss="modal">Hủy</button>
          <button type="submit" class="btn btn-brand" id="btnSaveMember"><i class="ti ti-device-floppy me-2"></i>Lưu thông tin</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  let globalMembers = [];

  async function loadMembers() {
    // Ẩn nút thêm mới nếu không phải admin
    if (window.currentUser && window.currentUser.role !== 'admin') {
      document.getElementById('adminActionsPanel').style.display = 'none';
    }

    const { data, error } = await window.sbClient.from('safe_members').select('*').order('created_at', { ascending: true });
    if (error) { Swal.fire('Lỗi tải dữ liệu', error.message, 'error'); return; }
    
    globalMembers = data;
    const tbody = document.getElementById('memberTableBody');
    tbody.innerHTML = '';

    data.forEach((member, index) => {
      let timeStr = '<span class="text-muted">Chưa từng đăng nhập</span>';
      if (member.last_login) {
          const d = new Date(member.last_login);
          timeStr = `<i class="ti ti-history me-1"></i> ${d.getHours().toString().padStart(2, '0')}:${d.getMinutes().toString().padStart(2, '0')} - ${d.toLocaleDateString('vi-VN')}`;
      }

      const roleBadge = member.role === 'admin' ? '<span class="badge bg-red text-white">ADMIN</span>' : (member.role === 'manager' ? '<span class="badge bg-orange text-white">LEADER</span>' : '<span class="badge bg-green text-white">SALES</span>');
      const statusBadge = member.is_active ? '<span class="text-success fw-bold">Đang hoạt động</span>' : '<span class="text-danger fw-bold">Bị khóa</span>';

      let actionColumn = '';
      if (window.currentUser && window.currentUser.role === 'admin') {
        const toggleBtn = member.is_active
          ? `<button class="btn btn-sm btn-outline-warning" onclick="toggleMemberStatus('${member.id}', false)"><i class="ti ti-lock"></i> Khóa</button>`
          : `<button class="btn btn-sm btn-outline-success" onclick="toggleMemberStatus('${member.id}', true)"><i class="ti ti-lock-open"></i> Mở khóa</button>`;

        actionColumn = `
          <td class="text-center admin-only-col">
            <div class="d-flex gap-2 justify-content-center">
              <button class="btn btn-sm btn-outline-primary" data-bs-toggle="modal" data-bs-target="#modal-member" onclick="openMemberModal('${member.id}')"><i class="ti ti-pencil"></i> Sửa</button>
              ${toggleBtn}
              <button class="btn btn-sm btn-outline-danger" onclick="deleteMember('${member.id}')"><i class="ti ti-trash"></i></button>
            </div>
          </td>
        `;
      }

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="text-center text-muted">${index + 1}</td>
        <td class="fw-bold">${member.full_name}</td>
        <td>${member.email}</td>
        <td>${roleBadge}</td>
        <td class="text-muted">${timeStr}</td>
        <td>${statusBadge}</td>
        ${actionColumn}
      `;
      tbody.appendChild(tr);
    });

    if (window.currentUser && window.currentUser.role !== 'admin') {
      document.querySelectorAll('.admin-only-col').forEach(col => col.style.display = 'none');
    }
  }

  function openMemberModal(id = null) {
    document.getElementById('memberForm').reset();
    document.getElementById('memberId').value = '';
    const passInput = document.getElementById('memPass');

    if (id) {
      document.getElementById('modalTitleMember').innerHTML = '<i class="ti ti-edit me-2"></i> Cập nhật nhân sự';
      const m = globalMembers.find(x => x.id === id);
      document.getElementById('memberId').value = m.id;
      document.getElementById('memFullName').value = m.full_name;
      document.getElementById('memEmail').value = m.email;
      document.getElementById('memRole').value = m.role;
      passInput.removeAttribute('required');
      passInput.placeholder = "Bỏ trống nếu không muốn đổi mật khẩu...";
    } else {
      document.getElementById('modalTitleMember').innerHTML = '<i class="ti ti-user-plus me-2"></i> Thêm nhân sự mới';
      passInput.setAttribute('required', 'true');
      passInput.placeholder = "Thiết lập mật khẩu...";
    }
  }

  async function saveMember() {
    const btn = document.getElementById('btnSaveMember');
    btn.disabled = true; btn.innerHTML = 'Đang xử lý...';
    
    const payload = {
      p_admin_id: window.currentUser.id,
      p_target_id: document.getElementById('memberId').value || null,
      p_full_name: document.getElementById('memFullName').value,
      p_email: document.getElementById('memEmail').value,
      p_password: document.getElementById('memPass').value || null,
      p_role: document.getElementById('memRole').value
    };

    try {
      const { error } = await window.sbClient.rpc('admin_save_member', payload);
      if (error) throw new Error(error.message);
      document.getElementById('btnCloseMemberModal').click();
      Swal.fire({ icon: 'success', title: 'Thành công', timer: 1500, showConfirmButton: false });
      loadMembers();
    } catch (err) { Swal.fire('Lỗi', err.message, 'error'); } 
    finally { btn.disabled = false; btn.innerHTML = '<i class="ti ti-device-floppy me-2"></i>Lưu thông tin'; }
  }

  function toggleMemberStatus(id, activate) {
    Swal.fire({ title: 'Xác nhận?', icon: 'warning', showCancelButton: true, confirmButtonText: 'Đồng ý' }).then(async (res) => {
      if (res.isConfirmed) {
        const { error } = await window.sbClient.rpc('admin_toggle_member', { p_admin_id: window.currentUser.id, p_target_id: id, p_is_active: activate });
        if (error) Swal.fire('Lỗi', error.message, 'error'); else loadMembers();
      }
    });
  }

  function deleteMember(id) {
    Swal.fire({ title: 'Xóa vĩnh viễn?', text: "Dữ liệu liên quan có thể bị lỗi, cân nhắc dùng tính năng KHÓA thay vì XÓA.", icon: 'error', showCancelButton: true, confirmButtonText: 'Vẫn Xóa' }).then(async (res) => {
      if (res.isConfirmed) {
        const { error } = await window.sbClient.rpc('admin_delete_member', { p_admin_id: window.currentUser.id, p_target_id: id });
        if (error) Swal.fire('Lỗi', error.message, 'error'); else loadMembers();
      }
    });
  }
</script>
